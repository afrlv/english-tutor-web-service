name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Параллельные пуши в main не наступают друг другу на пятки при деплое
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teacher
          POSTGRES_PASSWORD: teacher
          POSTGRES_DB: teacher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacher -d teacher"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: backend
        run: uv sync --group dev
      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://teacher:teacher@localhost:5432/teacher
        run: uv run pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to server
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted]
    steps:
      - name: Pull latest and (re)build prod stack
        run: |
          set -euo pipefail
          APP_DIR="$HOME/english-tutor-web-service"
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
          fi
          cd "$APP_DIR"
          git fetch --prune origin
          git reset --hard origin/main
          if [ ! -f .env ]; then
            echo "::error::.env не найден в $APP_DIR — положите прод-окружение (см. .env.prod.example)"
            exit 1
          fi
          docker compose -f docker-compose.prod.yml --env-file .env up -d --build
          docker image prune -f
